name: Inspect Dişli Source

on:
  push:
    branches: [main]
    paths:
      - 'Disli-kaynak.zip'
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -q Disli-kaynak.zip
          mkdir -p inspect
          find Disli/src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.json' \) -print0 | xargs -0 -I{} cp --parents {} inspect/
          cp Disli/app.json inspect/app.json
          cp Disli/package.json inspect/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: disli-source-inspect
          path: inspect/
          retention-days: 1
