name: Dişli Android
# EAS token configured in repository secrets

on:
  push:
    branches: [main]
    paths:
      - 'Disli-kaynak.zip'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      tur:
        description: 'Ne üretelim?'
        type: choice
        default: 'apk'
        options:
          - 'apk'
          - 'aab'

concurrency:
  group: disli-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hazırla
        run: |
          test -f Disli-kaynak.zip
          rm -rf Disli
          unzip -q Disli-kaynak.zip
          test -f Disli/package.json
          cp patches/apply-progression.mjs Disli/apply-progression.mjs
          cp patches/apply-runtime-fix.mjs Disli/apply-runtime-fix.mjs
          cp patches/apply-daily.mjs Disli/apply-daily.mjs
          cd Disli
          node apply-progression.mjs
          node apply-runtime-fix.mjs
          node apply-daily.mjs
          cp ../patches/apply-eas-config.mjs apply-eas-config.mjs
          node apply-eas-config.mjs
          cat > smoke.sh <<'SMOKE'
          #!/usr/bin/env bash
          set +e
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          RESULT="$ROOT/Disli/smoke-result.txt"
          APK="$ROOT/Disli/cikti/disli.apk"
          rm -f "$RESULT"

          adb get-state >/dev/null 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo 'INFRA: ADB emulator is not ready' | tee "$RESULT"
            exit 2
          fi

          echo '=== INSTALL ==='
          timeout 90s adb install -r "$APK"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: adb install rc=$rc" | tee "$RESULT"
            exit 1
          fi

          adb logcat -c
          echo '=== FIRST LAUNCH / INTRO -> GAME ==='
          timeout 30s adb shell monkey -p com.aslaninteraktif.disli 1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: first launch rc=$rc" | tee "$RESULT"
            adb logcat -d -v time | tail -n 250
            exit 1
          fi

          sleep 20
          timeout 10s adb shell pidof com.aslaninteraktif.disli >/dev/null
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo 'FAIL: app died after intro/game transition' | tee "$RESULT"
            echo '=== CRASH LOG ==='
            adb logcat -d -v time | tail -n 400
            exit 1
          fi

          echo '=== SECOND LAUNCH ==='
          timeout 10s adb shell am force-stop com.aslaninteraktif.disli
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: force-stop rc=$rc" | tee "$RESULT"
            exit 1
          fi

          timeout 30s adb shell monkey -p com.aslaninteraktif.disli 1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: second launch rc=$rc" | tee "$RESULT"
            adb logcat -d -v time | tail -n 400
            exit 1
          fi

          sleep 10
          timeout 10s adb shell pidof com.aslaninteraktif.disli >/dev/null
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo 'FAIL: app did not survive second launch' | tee "$RESULT"
            echo '=== CRASH LOG ==='
            adb logcat -d -v time | tail -n 400
            exit 1
          fi

          echo 'PASS: first launch survived intro/game and second launch succeeded' | tee "$RESULT"
          echo '=== CRASH FILTER ==='
          adb logcat -d -v time | grep -E 'FATAL EXCEPTION|AndroidRuntime|SIG(SEGV|ABRT)|UnsatisfiedLinkError|Skia|RNSkia|expo|ReactNativeJS' -C 3 || true
          SMOKE
          chmod +x smoke.sh

      - name: Expo projectId kontrolü
        run: |
          node -e "const x=require('./Disli/app.json'); if(!x.expo.extra?.eas?.projectId) { console.error('app.json içinde expo.extra.eas.projectId yok. Önce Expo projesini EAS ile bağla.'); process.exit(1) }"

      - name: Paketler
        working-directory: Disli
        run: npm ci

      - name: Testler
        working-directory: Disli
        run: npm test -- --runInBand --watch=false

      - name: TypeScript
        working-directory: Disli
        run: npx tsc --noEmit

      - name: Expo Doctor
        working-directory: Disli
        run: npx expo-doctor

      - name: EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Android build
        working-directory: Disli
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p cikti
          TUR="${{ inputs.tur || 'apk' }}"
          if [ "$TUR" = "aab" ]; then
            eas build --platform android --profile production --local --non-interactive --output cikti/disli.aab
          else
            eas build --platform android --profile preview --local --non-interactive --output cikti/disli.apk
          fi


      - name: Android smoke test (emulator)
        if: ${{ inputs.tur != 'aab' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash Disli/smoke.sh

      - name: Smoke sonucu
        if: ${{ inputs.tur != 'aab' }}
        run: |
          test -f Disli/smoke-result.txt || {
            echo 'Smoke sonucu alınamadı: emulator/ADB altyapısı script başlamadan veya sırasında çöktü.'
            exit 1
          }
          cat Disli/smoke-result.txt
          if grep -q '^PASS:' Disli/smoke-result.txt; then
            exit 0
          fi
          if grep -q '^INFRA:' Disli/smoke-result.txt; then
            echo 'Smoke testi çalışmadı: emulator/ADB altyapısı hazır değildi.'
            exit 0
          fi
          exit 1

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disli-${{ inputs.tur || 'apk' }}
          path: Disli/cikti/
          if-no-files-found: warn
          retention-days: 14
