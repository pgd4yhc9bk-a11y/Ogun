name: Dişli Android
# EAS token configured in repository secrets
# Rebuild after runtime audio fix
# Lazy-load native game stack after intro
# Trigger after TypeScript fix

on:
  push:
    branches: [main]
    paths:
      - 'Disli-kaynak.zip'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      tur:
        description: 'Ne üretelim?'
        type: choice
        default: 'apk'
        options:
          - 'apk'
          - 'aab'

concurrency:
  group: disli-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hazırla
        run: |
          test -f Disli-kaynak.zip
          rm -rf Disli
          unzip -q Disli-kaynak.zip
          test -f Disli/package.json
          cp patches/apply-progression.mjs Disli/apply-progression.mjs
          cp patches/apply-runtime-fix.mjs Disli/apply-runtime-fix.mjs
          cp patches/apply-daily.mjs Disli/apply-daily.mjs
          cd Disli
          node apply-progression.mjs
          node apply-runtime-fix.mjs
          node apply-daily.mjs
          cp ../patches/apply-eas-config.mjs apply-eas-config.mjs
          node apply-eas-config.mjs

      - name: Expo projectId kontrolü
        run: |
          node -e "const x=require('./Disli/app.json'); if(!x.expo.extra?.eas?.projectId) { console.error('app.json içinde expo.extra.eas.projectId yok. Önce Expo projesini EAS ile bağla.'); process.exit(1) }"

      - name: Paketler
        working-directory: Disli
        run: npm ci

      - name: Testler
        working-directory: Disli
        run: npm test -- --runInBand --watch=false

      - name: TypeScript
        working-directory: Disli
        run: npx tsc --noEmit

      - name: Expo Doctor
        working-directory: Disli
        run: npx expo-doctor

      - name: EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Android build
        working-directory: Disli
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p cikti
          TUR="${{ inputs.tur || 'apk' }}"
          if [ "$TUR" = "aab" ]; then
            eas build --platform android --profile production --local --non-interactive --output cikti/disli.aab
          else
            eas build --platform android --profile preview --local --non-interactive --output cikti/disli.apk
          fi

      - name: Android smoke test (emulator)
        if: ${{ inputs.tur != 'aab' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            rm -f Disli/smoke-result.txt
            adb install -r Disli/cikti/disli.apk
            install_rc=$?
            if [ "$install_rc" -ne 0 ]; then
              echo "FAIL: adb install exited $install_rc" | tee Disli/smoke-result.txt
              exit 1
            fi
            adb logcat -c
            adb shell monkey -p com.aslaninteraktif.disli 1
            launch_rc=$?
            if [ "$launch_rc" -ne 0 ]; then
              echo "FAIL: app launch exited $launch_rc" | tee Disli/smoke-result.txt
              adb logcat -d -v time | grep -E 'FATAL EXCEPTION|AndroidRuntime|SIG(SEGV|ABRT)|UnsatisfiedLinkError|Skia|RNSkia|expo|ReactNativeJS' -C 4 || true
              exit 1
            fi
            sleep 12
            if ! adb shell pidof com.aslaninteraktif.disli >/dev/null; then
              echo 'FAIL: Dişli process is not alive after launch' | tee Disli/smoke-result.txt
              echo '=== DIŞLI CRASH LOG ===
              adb logcat -d -v time | grep -E 'FATAL EXCEPTION|AndroidRuntime|SIG(SEGV|ABRT)|UnsatisfiedLinkError|Skia|RNSkia|expo|ReactNativeJS' -C 4 || true
              exit 1
            fi
            echo 'PASS: Dişli process stayed alive for 12 seconds' | tee Disli/smoke-result.txt
            echo '=== DIŞLI SMOKE OK ===
            adb logcat -d -v time | grep -E 'FATAL EXCEPTION|AndroidRuntime|SIG(SEGV|ABRT)|UnsatisfiedLinkError|Skia|RNSkia|expo|ReactNativeJS' -C 2 || true

      - name: Smoke sonucu
        if: ${{ inputs.tur != 'aab' }}
        run: |
          test -f Disli/smoke-result.txt || {
            echo 'Smoke sonucu alınamadı: emulator/ADB altyapısı script başlamadan veya sırasında çöktü.'
            exit 1
          }
          cat Disli/smoke-result.txt
          grep -q '^PASS:' Disli/smoke-result.txt
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: disli-${{ inputs.tur || 'apk' }}
          path: Disli/cikti/
          retention-days: 14
